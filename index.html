<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌾 3D Ферма - расти и собирай</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 12px 24px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid #ffd966;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 10;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 18px;
        }
        #coinDisplay {
            background: #f5c542;
            color: #1d2f1a;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: inset 0 -3px 0 #a77d2a;
        }
        #levelDisplay {
            background: #3c6b3a;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 1rem;
            border: 1px solid #a9c97a;
        }
        #ui {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            padding: 0 16px;
            z-index: 20;
            pointer-events: none;
        }
        #ui button {
            pointer-events: auto;
            background: #faf3d7;
            border: none;
            padding: 14px 32px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #1d3a12;
            box-shadow: 0 6px 0 #6d8756, 0 8px 24px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: 0.06s linear;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #e7d990;
            min-width: 140px;
            justify-content: center;
        }
        #ui button:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #6d8756;
        }
        #ui button:disabled {
            opacity: 0.4;
            transform: translateY(4px);
            box-shadow: 0 2px 0 #6d8756;
            pointer-events: none;
        }
        #message {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 20, 5, 0.8);
            backdrop-filter: blur(6px);
            color: #f5f0c0;
            padding: 10px 28px;
            border-radius: 60px;
            font-size: 1rem;
            border: 1px solid #d4c97a;
            white-space: nowrap;
            z-index: 15;
            font-weight: 500;
            letter-spacing: 0.3px;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,200,0.3);
            font-size: 2.4rem;
            pointer-events: none;
            z-index: 5;
            text-shadow: 0 0 12px rgba(0,0,0,0.5);
        }
        @media (max-width: 600px) {
            #info { font-size: 0.8rem; padding: 8px 16px; gap: 10px; flex-wrap: wrap; }
            #ui button { padding: 10px 16px; font-size: 1rem; min-width: 100px; }
            #message { font-size: 0.8rem; padding: 6px 16px; bottom: 100px; white-space: normal; }
        }
    </style>
</head>
<body>
    <div id="info">
        <span>🪙 <span id="coinCounter">20</span></span>
        <span id="levelDisplay">🌱 Уровень 1</span>
    </div>
    <div id="crosshair">+</div>
    <div id="message">🌾 Наведись на клетку и нажми "Посадить"</div>
    <div id="ui">
        <button id="plantBtn">🌿 Посадить</button>
        <button id="harvestBtn">🧺 Собрать</button>
        <button id="resetBtn" style="background:#d6c29a; box-shadow:0 6px 0 #7b6d48;">🔄 Сброс</button>
    </div>

    <!-- Подключаем Three.js и доп. библиотеки -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- Конфиг ---
        const GROW_TIME = 8000;
        const HARVEST_REWARD = 5;
        const PLANT_COST = 2;
        const GRID_SIZE = 3;
        const CELL_SIZE = 1.8;
        const OFFSET = (GRID_SIZE - 1) * CELL_SIZE / 2;

        // --- Состояние ---
        let cells = []; // { stage: 0,1,2, timer: null, mesh: null, label: null }
        let coins = 20;
        let level = 1;
        let selectedIndex = null;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        // --- DOM ---
        const coinSpan = document.getElementById('coinCounter');
        const levelSpan = document.getElementById('levelDisplay');
        const messageEl = document.getElementById('message');

        // --- Сцена, камера, рендеры ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 40);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(6, 8, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // --- Управление (камера) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.2, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.maxPolarAngle = Math.PI / 2.4;
        controls.minDistance = 4;
        controls.maxDistance = 18;
        controls.update();

        // --- Освещение ---
        const ambient = new THREE.AmbientLight(0x404c38, 0.6);
        scene.add(ambient);

        const sun = new THREE.DirectionalLight(0xfff5d1, 1.2);
        sun.position.set(10, 18, 6);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 1024;
        sun.shadow.mapSize.height = 1024;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 30;
        sun.shadow.camera.left = -10;
        sun.shadow.camera.right = 10;
        sun.shadow.camera.top = 10;
        sun.shadow.camera.bottom = -10;
        scene.add(sun);

        const fill = new THREE.DirectionalLight(0xc4e0ff, 0.4);
        fill.position.set(-8, 4, -6);
        scene.add(fill);

        const hemi = new THREE.HemisphereLight(0x87CEEB, 0x3a5f2a, 0.5);
        scene.add(hemi);

        // --- Земля (поляна) ---
        const groundGeo = new THREE.PlaneGeometry(18, 18);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x5d8c4a, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.05;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- Создание сетки полей ---
        function createGrid() {
            const gridGroup = new THREE.Group();
            const cellMeshes = [];

            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    const x = j * CELL_SIZE - OFFSET;
                    const z = i * CELL_SIZE - OFFSET;

                    // Поле (грядка)
                    const boxGeo = new THREE.BoxGeometry(CELL_SIZE * 0.9, 0.3, CELL_SIZE * 0.9);
                    const boxMat = new THREE.MeshStandardMaterial({ 
                        color: 0x6b8f4a, 
                        roughness: 0.8,
                        emissive: new THREE.Color(0x2a401a),
                        emissiveIntensity: 0.1
                    });
                    const box = new THREE.Mesh(boxGeo, boxMat);
                    box.position.set(x, 0.15, z);
                    box.receiveShadow = true;
                    box.castShadow = true;
                    gridGroup.add(box);

                    // Рамка (бортик)
                    const edgeGeo = new THREE.EdgesGeometry(boxGeo);
                    const edgeMat = new THREE.LineBasicMaterial({ color: 0xad9a5a });
                    const edge = new THREE.LineSegments(edgeGeo, edgeMat);
                    edge.position.copy(box.position);
                    gridGroup.add(edge);

                    // Сохраняем данные
                    const cellData = {
                        stage: 0,
                        timer: null,
                        mesh: box,
                        label: null,
                        plantMesh: null,
                        index: i * GRID_SIZE + j,
                        pos: new THREE.Vector3(x, 0.5, z)
                    };
                    cellMeshes.push(cellData);
                }
            }
            scene.add(gridGroup);
            return cellMeshes;
        }

        // --- Создание растений (3D) ---
        function createPlantMesh(stage) {
            const group = new THREE.Group();
            
            if (stage === 1) { // росток
                const stemGeo = new THREE.CylinderGeometry(0.08, 0.12, 0.7);
                const stemMat = new THREE.MeshStandardMaterial({ color: 0x6a994e });
                const stem = new THREE.Mesh(stemGeo, stemMat);
                stem.position.y = 0.35;
                stem.castShadow = true;
                group.add(stem);

                const leafGeo = new THREE.SphereGeometry(0.25, 5);
                const leafMat = new THREE.MeshStandardMaterial({ color: 0x8bc34a });
                const leaf = new THREE.Mesh(leafGeo, leafMat);
                leaf.position.set(0.2, 0.6, 0.1);
                leaf.scale.set(0.8, 0.4, 0.8);
                leaf.castShadow = true;
                group.add(leaf);
                
                const leaf2 = leaf.clone();
                leaf2.position.set(-0.2, 0.6, -0.1);
                leaf2.scale.set(0.8, 0.4, 0.8);
                group.add(leaf2);
            } else if (stage === 2) { // созревшее (с колосьями)
                const stemGeo = new THREE.CylinderGeometry(0.1, 0.15, 0.9);
                const stemMat = new THREE.MeshStandardMaterial({ color: 0x7a9c5a });
                const stem = new THREE.Mesh(stemGeo, stemMat);
                stem.position.y = 0.45;
                stem.castShadow = true;
                group.add(stem);

                // колосья (золотистые шарики)
                for (let k = 0; k < 6; k++) {
                    const angle = (k / 6) * Math.PI * 2;
                    const r = 0.25;
                    const grain = new THREE.Mesh(
                        new THREE.SphereGeometry(0.12, 4),
                        new THREE.MeshStandardMaterial({ color: 0xf5c542, emissive: new THREE.Color(0x8a6d1a), emissiveIntensity: 0.2 })
                    );
                    grain.position.set(Math.cos(angle) * r, 0.6 + Math.sin(k*1.2)*0.1, Math.sin(angle) * r);
                    grain.castShadow = true;
                    group.add(grain);
                }
                // дополнительный колосок
                const top = new THREE.Mesh(
                    new THREE.SphereGeometry(0.18, 5),
                    new THREE.MeshStandardMaterial({ color: 0xeac54a, emissive: new THREE.Color(0x7a5d1a), emissiveIntensity: 0.2 })
                );
                top.position.set(0, 0.9, 0);
                top.castShadow = true;
                group.add(top);
            }
            return group;
        }

        // --- Инициализация ---
        const cellDataArray = createGrid();
        cells = cellDataArray;

        // Добавим вспомогательные объекты (деревья, траву)
        function addDecor() {
            const treeMat = new THREE.MeshStandardMaterial({ color: 0x4d7a3a });
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4f2e });
            for (let i = 0; i < 12; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 4.5 + Math.random() * 4;
                const x = Math.cos(angle) * dist;
                const z = Math.sin(angle) * dist;
                if (Math.abs(x) < 3.5 && Math.abs(z) < 3.5) continue;
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 1.2), trunkMat);
                trunk.position.set(x, 0.6, z);
                trunk.castShadow = true;
                scene.add(trunk);
                const crown = new THREE.Mesh(new THREE.SphereGeometry(0.7 + Math.random()*0.4, 5), treeMat);
                crown.position.set(x, 1.4 + Math.random()*0.3, z);
                crown.castShadow = true;
                scene.add(crown);
            }
            // трава
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x5d874a });
            for (let i = 0; i < 60; i++) {
                const x = (Math.random() - 0.5) * 16;
                const z = (Math.random() - 0.5) * 16;
                if (Math.abs(x) < 3.2 && Math.abs(z) < 3.2) continue;
                const blade = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.2, 3), grassMat);
                blade.position.set(x, 0.1, z);
                blade.rotation.y = Math.random() * Math.PI;
                scene.add(blade);
            }
        }
        addDecor();

        // --- Обновление 3D сцены в соответствии с состоянием ---
        function updateScene() {
            cells.forEach((cell, idx) => {
                // Удаляем старое растение
                if (cell.plantMesh) {
                    scene.remove(cell.plantMesh);
                    cell.plantMesh = null;
                }
                // Удаляем старую метку
                if (cell.label) {
                    scene.remove(cell.label);
                    cell.label = null;
                }

                if (cell.stage === 1 || cell.stage === 2) {
                    const plant = createPlantMesh(cell.stage);
                    plant.position.copy(cell.pos);
                    plant.position.y = 0.3;
                    scene.add(plant);
                    cell.plantMesh = plant;

                    // Добавляем таймер (CSS2D) для стадии 1
                    if (cell.stage === 1 && cell.timer) {
                        const remaining = Math.max(0, (cell.timer - Date.now()));
                        const secs = Math.ceil(remaining / 1000);
                        const div = document.createElement('div');
                        div.textContent = `⏳ ${secs}s`;
                        div.style.color = '#f5f0b0';
                        div.style.fontSize = '18px';
                        div.style.fontWeight = 'bold';
                        div.style.textShadow = '0 2px 12px black';
                        div.style.background = 'rgba(0,0,0,0.5)';
                        div.style.padding = '2px 12px';
                        div.style.borderRadius = '30px';
                        div.style.border = '1px solid #d4c97a';
                        const label = new CSS2DObject(div);
                        label.position.set(cell.pos.x, cell.pos.y + 1.2, cell.pos.z);
                        scene.add(label);
                        cell.label = label;
                    }
                }
            });
            // обновляем счетчики
            coinSpan.textContent = coins;
            levelSpan.textContent = level;
        }

        // --- Проверка роста (таймеры) ---
        function checkGrowth() {
            let changed = false;
            const now = Date.now();
            cells.forEach((cell, idx) => {
                if (cell.stage === 1 && cell.timer && now >= cell.timer) {
                    cell.stage = 2;
                    cell.timer = null;
                    changed = true;
                    messageEl.textContent = `🌾 Ячейка ${idx+1} созрела! Соберите.`;
                }
            });
            if (changed) {
                updateScene();
                // также обновляем таймеры на этикетках
            }
        }

        // --- Raycaster для выбора клетки ---
        function getIntersectedCell(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const meshes = cells.map(c => c.mesh);
            const intersects = raycaster.intersectObjects(meshes);
            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                for (let i = 0; i < cells.length; i++) {
                    if (cells[i].mesh === hitMesh) {
                        return i;
                    }
                }
            }
            return null;
        }

        // --- Обработчики кликов по сцене (выбор) ---
        renderer.domElement.addEventListener('click', (event) => {
            const idx = getIntersectedCell(event);
            if (idx !== null) {
                selectedIndex = idx;
                const cell = cells[idx];
                const stageNames = ['пустая', 'растёт', 'созрела'];
                let msg = `🌱 Ячейка ${idx+1}: ${stageNames[cell.stage]}`;
                if (cell.stage === 1 && cell.timer) {
                    const remain = Math.max(0, (cell.timer - Date.now()));
                    msg += ` (осталось ${Math.ceil(remain/1000)}с)`;
                }
                messageEl.textContent = `👉 ${msg}`;
                // Подсветка
                cells.forEach((c, i) => {
                    c.mesh.material.emissive.setHex(i === idx ? 0x665522 : 0x2a401a);
                    c.mesh.material.emissiveIntensity = i === idx ? 0.5 : 0.1;
                });
            } else {
                // Снять выделение
                selectedIndex = null;
                cells.forEach(c => {
                    c.mesh.material.emissive.setHex(0x2a401a);
                    c.mesh.material.emissiveIntensity = 0.1;
                });
                messageEl.textContent = '🌾 Наведись на клетку и кликни для выбора';
            }
        });

        // --- Действия ---
        function plantAction() {
            if (selectedIndex === null) {
                messageEl.textContent = '⚠️ Сначала кликни на пустую клетку!';
                return;
            }
            const idx = selectedIndex;
            const cell = cells[idx];
            if (cell.stage !== 0) {
                messageEl.textContent = '❌ Эта клетка не пустая!';
                return;
            }
            if (coins < PLANT_COST) {
                messageEl.textContent = `💸 Не хватает монет! Нужно ${PLANT_COST}`;
                return;
            }
            coins -= PLANT_COST;
            cell.stage = 1;
            cell.timer = Date.now() + GROW_TIME;
            messageEl.textContent = `🌱 Посажено! Жди ${GROW_TIME/1000} секунд.`;
            updateScene();
            // убираем подсветку
            cells.forEach(c => { c.mesh.material.emissive.setHex(0x2a401a); c.mesh.material.emissiveIntensity = 0.1; });
            selectedIndex = null;
        }

        function harvestAction() {
            if (selectedIndex === null) {
                messageEl.textContent = '⚠️ Кликни на созревшую клетку!';
                return;
            }
            const idx = selectedIndex;
            const cell = cells[idx];
            if (cell.stage !== 2) {
                messageEl.textContent = '❌ Эта клетка не созрела!';
                return;
            }
            coins += HARVEST_REWARD;
            cell.stage = 0;
            cell.timer = null;
            messageEl.textContent = `🧺 Собрано! +${HARVEST_REWARD} 🪙`;
            // уровень
            const newLevel = Math.floor(coins / 50) + 1;
            if (newLevel > level) {
                level = newLevel;
                messageEl.textContent += ` 🎉 Уровень ${level}!`;
            }
            updateScene();
            cells.forEach(c => { c.mesh.material.emissive.setHex(0x2a401a); c.mesh.material.emissiveIntensity = 0.1; });
            selectedIndex = null;
        }

        function resetFarm() {
            cells.forEach(c => {
                c.stage = 0;
                c.timer = null;
                if (c.plantMesh) { scene.remove(c.plantMesh); c.plantMesh = null; }
                if (c.label) { scene.remove(c.label); c.label = null; }
                c.mesh.material.emissive.setHex(0x2a401a);
                c.mesh.material.emissiveIntensity = 0.1;
            });
            coins = 20;
            level = 1;
            selectedIndex = null;
            messageEl.textContent = '🔄 Ферма сброшена. Начинай заново!';
            updateScene();
        }

        // --- Подключение кнопок ---
        document.getElementById('plantBtn').addEventListener('click', plantAction);
        document.getElementById('harvestBtn').addEventListener('click', harvestAction);
        document.getElementById('resetBtn').addEventListener('click', resetFarm);

        // --- Цикл обновления ---
        setInterval(() => {
            checkGrowth();
            // обновляем таймеры на этикетках (пересоздаём)
            updateScene();
        }, 1000);

        // --- Анимация ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        // --- Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Стартовое обновление
        updateScene();
        messageEl.textContent = '🌾 Кликни на клетку для выбора, затем сажай или собирай!';

    </script>
</body>
</html>
