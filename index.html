<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🌾 Ферма: расти и собирай</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100dvh;
      background: #1e3c2c;
      background-image: radial-gradient(circle at 20% 30%, #2a5a3a, #0f281a);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .farm-card {
      max-width: 460px;
      width: 100%;
      background: #8cb87a;
      background: linear-gradient(145deg, #a8d08d, #7baa65);
      border-radius: 56px 56px 40px 40px;
      padding: 20px 18px 28px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.6), inset 0 2px 8px rgba(255,255,200,0.4);
      border: 2px solid #d9d27e;
      transition: all 0.1s;
    }
    .farm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f5f0d7;
      padding: 12px 18px;
      border-radius: 100px;
      margin-bottom: 18px;
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.1), 0 4px 0 #6f8f5a;
      border: 1px solid #e8e0b0;
      font-weight: bold;
      color: #2d4722;
    }
    .coin-display {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.3rem;
      background: #fef9e0;
      padding: 4px 16px 4px 12px;
      border-radius: 40px;
      border: 1px solid #bfa85a;
      box-shadow: inset 0 1px 4px #ffeeaa;
    }
    .coin-display span {
      font-size: 1.6rem;
      line-height: 1;
    }
    .level-badge {
      background: #4d6b3a;
      padding: 6px 18px;
      border-radius: 40px;
      color: #f5f0d0;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      border: 1px solid #c7d48a;
      box-shadow: inset 0 -2px 0 #1f3a16;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 18px 0 20px;
    }
    .cell {
      aspect-ratio: 1 / 1;
      background: #5d7e4a;
      background: radial-gradient(circle at 30% 30%, #7ca064, #3d5f2b);
      border-radius: 28px;
      box-shadow: inset 0 -8px 0 #2b461e, 0 8px 0 #1f3514, 0 6px 12px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: 0.08s linear;
      cursor: pointer;
      border: 2px solid #b6b071;
      font-size: 2.6rem;
      padding: 6px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      position: relative;
      color: #fcf9e0;
    }
    .cell:active {
      transform: scale(0.94);
      box-shadow: inset 0 -4px 0 #1f3514, 0 4px 0 #1f3514;
    }
    .cell .stage-label {
      font-size: 0.6rem;
      background: #1d2f16cc;
      padding: 2px 10px;
      border-radius: 40px;
      color: #efeac0;
      margin-top: 2px;
      letter-spacing: 0.3px;
      backdrop-filter: blur(2px);
      border: 1px solid #c5b97a;
      font-weight: 600;
      text-shadow: 0 1px 2px black;
      white-space: nowrap;
    }
    .cell .timer-badge {
      position: absolute;
      bottom: 4px;
      right: 6px;
      background: #0f1f0ac0;
      backdrop-filter: blur(2px);
      padding: 1px 8px;
      border-radius: 40px;
      font-size: 0.7rem;
      color: #f5f0b0;
      border: 1px solid #bcb06a;
      font-weight: 600;
    }
    .cell.empty {
      background: #6b8f55;
      background: radial-gradient(circle at 30% 30%, #82a86a, #4a6d35);
      color: #e8edc0;
    }
    .cell.empty .stage-label {
      background: #1f3318b0;
    }
    .action-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: #e5debc;
      padding: 10px 12px;
      border-radius: 80px;
      margin: 12px 0 6px;
      border: 1px solid #d2c78a;
      box-shadow: inset 0 2px 8px #baa86a, 0 4px 0 #778f5a;
      gap: 8px;
    }
    .action-btn {
      background: #fbf6d9;
      border: none;
      padding: 8px 18px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1rem;
      color: #1a3a12;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 0 #6d8756, 0 4px 10px rgba(0,0,0,0.2);
      transition: 0.06s linear;
      cursor: pointer;
      border: 1px solid #e7d990;
      flex: 1 1 auto;
      justify-content: center;
    }
    .action-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 #6d8756;
    }
    .action-btn:disabled {
      opacity: 0.45;
      transform: translateY(2px);
      box-shadow: 0 2px 0 #6d8756;
      pointer-events: none;
    }
    .reset-btn {
      background: #d6c29a;
      color: #252514;
      box-shadow: 0 4px 0 #7b6d48;
      flex: 0.5;
    }
    .info-text {
      background: #f2edd0;
      border-radius: 40px;
      padding: 10px 18px;
      margin: 12px 0 0;
      text-align: center;
      font-weight: 600;
      color: #1d3a12;
      border: 1px solid #c8bb7a;
      box-shadow: inset 0 2px 6px #bbb06a;
      font-size: 0.95rem;
    }
    .info-text small {
      font-weight: 400;
      opacity: 0.8;
    }
    @media (max-width: 460px) {
      .farm-card { padding: 14px 12px; }
      .cell { font-size: 2.2rem; }
      .action-btn { font-size: 0.9rem; padding: 6px 12px; }
    }
  </style>
</head>
<body>
<div class="farm-card">
  <div class="farm-header">
    <div class="coin-display"><span>🪙</span> <span id="coinCounter">0</span></div>
    <div class="level-badge">🌱 УРОВЕНЬ <span id="levelDisplay">1</span></div>
  </div>

  <!-- 3x3 сетка -->
  <div class="grid-container" id="gridContainer">
    <!-- 9 ячеек будут сгенерированы JS -->
  </div>

  <div class="action-bar">
    <button class="action-btn" id="plantBtn">🌿 Посадить</button>
    <button class="action-btn" id="harvestBtn">🧺 Собрать</button>
    <button class="action-btn reset-btn" id="resetBtn">🔄 Сброс</button>
  </div>

  <div class="info-text" id="infoMessage">
    🌾 Нажми «Посадить» на пустую клетку, жди, затем «Собрать»
  </div>
</div>

<script>
  (function(){
    // --- Конфиг ---
    const GROW_TIME = 8000;          // 8 секунд до полного роста
    const HARVEST_REWARD = 5;        // монет за сбор
    const PLANT_COST = 2;            // стоимость посадки

    // --- Состояние ---
    let cells = [];                 // 9 элементов: { stage: 0|1|2, timer: null }
    let coins = 20;                // стартовые монеты
    let level = 1;
    let selectedIndex = null;      // индекс выделенной ячейки (для посадки/сбора)

    // DOM
    const gridEl = document.getElementById('gridContainer');
    const coinSpan = document.getElementById('coinCounter');
    const levelSpan = document.getElementById('levelDisplay');
    const infoEl = document.getElementById('infoMessage');

    // --- Вспомогательные ---
    function updateUI() {
      coinSpan.textContent = coins;
      levelSpan.textContent = level;
      renderGrid();
    }

    // Отрисовка сетки
    function renderGrid() {
      gridEl.innerHTML = '';
      for (let i = 0; i < cells.length; i++) {
        const cell = cells[i];
        const div = document.createElement('div');
        div.className = 'cell';
        div.dataset.index = i;

        // Стадия и иконка
        let icon = '🟫';
        let stageText = 'пусто';
        let timerText = '';

        if (cell.stage === 0) {
          icon = '🟫';
          stageText = 'пусто';
          div.classList.add('empty');
        } else if (cell.stage === 1) {
          icon = '🌱';
          stageText = 'рост...';
          if (cell.timer) {
            const remaining = Math.max(0, (cell.timer - Date.now()));
            const secs = Math.ceil(remaining / 1000);
            timerText = `${secs}с`;
          }
        } else if (cell.stage === 2) {
          icon = '🌾';
          stageText = 'созрело!';
        }

        div.innerHTML = `
          <span style="font-size:2.2rem; line-height:1;">${icon}</span>
          <span class="stage-label">${stageText}</span>
          ${timerText ? `<span class="timer-badge">⏳ ${timerText}</span>` : ''}
        `;

        // Клик по ячейке — выбрать для действия
        div.addEventListener('click', (e) => {
          const idx = parseInt(e.currentTarget.dataset.index);
          selectedIndex = idx;
          const cellData = cells[idx];
          let msg = `Ячейка ${idx+1}: ${cellData.stage === 0 ? 'пустая' : cellData.stage === 1 ? 'растёт' : 'созрела'}`;
          if (cellData.stage === 1 && cellData.timer) {
            const remain = Math.max(0, (cellData.timer - Date.now()));
            msg += ` (осталось ${Math.ceil(remain/1000)}с)`;
          }
          infoEl.textContent = `👉 ${msg}`;
          // подсветка (убираем у всех, добавляем текущей)
          document.querySelectorAll('.cell').forEach(el => el.style.outline = 'none');
          e.currentTarget.style.outline = '3px solid #f9f3b0';
          e.currentTarget.style.outlineOffset = '2px';
        });

        gridEl.appendChild(div);
      }
    }

    // --- Логика таймеров роста (проверка каждую секунду) ---
    function checkGrowth() {
      let changed = false;
      const now = Date.now();
      for (let i = 0; i < cells.length; i++) {
        const c = cells[i];
        if (c.stage === 1 && c.timer) {
          if (now >= c.timer) {
            // выросло!
            c.stage = 2;
            c.timer = null;
            changed = true;
            // уведомление
            infoEl.textContent = `🌾 Ячейка ${i+1} созрела! Соберите урожай.`;
          }
        }
      }
      if (changed) {
        renderGrid();
        // также обновить таймеры на клетках (перерисовка)
      }
    }

    // --- Посадка ---
    function plantAction() {
      if (selectedIndex === null) {
        infoEl.textContent = '⚠️ Сначала нажми на пустую клетку!';
        return;
      }
      const idx = selectedIndex;
      const cell = cells[idx];
      // проверка: пустая и хватает монет
      if (cell.stage !== 0) {
        infoEl.textContent = '❌ Эта клетка не пустая (растёт или уже созрела)';
        return;
      }
      if (coins < PLANT_COST) {
        infoEl.textContent = `💸 Не хватает монет! Нужно ${PLANT_COST}, у вас ${coins}`;
        return;
      }

      // сажаем
      coins -= PLANT_COST;
      cell.stage = 1;
      cell.timer = Date.now() + GROW_TIME;
      infoEl.textContent = `🌱 Посажено! Жди ${GROW_TIME/1000} секунд.`;
      selectedIndex = null; // сброс выделения
      // убираем подсветку
      document.querySelectorAll('.cell').forEach(el => el.style.outline = 'none');
      updateUI();
    }

    // --- Сбор урожая ---
    function harvestAction() {
      if (selectedIndex === null) {
        infoEl.textContent = '⚠️ Нажми на созревшую клетку для сбора!';
        return;
      }
      const idx = selectedIndex;
      const cell = cells[idx];
      if (cell.stage !== 2) {
        infoEl.textContent = '❌ Эта клетка не созрела! (пустая или растёт)';
        return;
      }

      // собираем
      coins += HARVEST_REWARD;
      cell.stage = 0;
      cell.timer = null;
      infoEl.textContent = `🧺 Собрано! +${HARVEST_REWARD} 🪙`;
      selectedIndex = null;
      document.querySelectorAll('.cell').forEach(el => el.style.outline = 'none');

      // повышение уровня (каждые 50 монет)
      const newLevel = Math.floor(coins / 50) + 1;
      if (newLevel > level) {
        level = newLevel;
        infoEl.textContent += ` 🎉 Уровень ${level}!`;
      }
      updateUI();
    }

    // --- Сброс фермы ---
    function resetFarm() {
      // отмена всех таймеров (просто сброс)
      for (let i = 0; i < cells.length; i++) {
        if (cells[i].timer) {
          cells[i].timer = null;
        }
        cells[i].stage = 0;
      }
      coins = 20;
      level = 1;
      selectedIndex = null;
      document.querySelectorAll('.cell').forEach(el => el.style.outline = 'none');
      infoEl.textContent = '🔄 Ферма сброшена. Начинай заново!';
      updateUI();
    }

    // --- Инициализация ---
    function initGame() {
      cells = Array(9).fill().map(() => ({
        stage: 0,
        timer: null,
      }));
      coins = 20;
      level = 1;
      selectedIndex = null;
      updateUI();
      infoEl.textContent = '🌾 Нажми на клетку, затем «Посадить» или «Собрать»';
      // запускаем цикл проверки роста каждую секунду
      if (window.growInterval) clearInterval(window.growInterval);
      window.growInterval = setInterval(() => {
        checkGrowth();
        // дополнительно обновляем таймеры на клетках (перерисовка)
        renderGrid(); 
        // но чтобы не сбить подсветку, восстановим outline если выбран
        if (selectedIndex !== null) {
          const allCells = document.querySelectorAll('.cell');
          allCells.forEach((el, i) => {
            if (i === selectedIndex) {
              el.style.outline = '3px solid #f9f3b0';
              el.style.outlineOffset = '2px';
            } else {
              el.style.outline = 'none';
            }
          });
        }
        // также обновляем сообщение если таймер истек (но уже в checkGrowth)
      }, 1000);
    }

    // --- Подключение кнопок ---
    document.getElementById('plantBtn').addEventListener('click', plantAction);
    document.getElementById('harvestBtn').addEventListener('click', harvestAction);
    document.getElementById('resetBtn').addEventListener('click', resetFarm);

    // Старт
    initGame();
  })();
</script>
</body>
</html>
