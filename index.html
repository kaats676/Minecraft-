<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Майнкрафт на iPad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Courier New', monospace;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        #info {
            position: absolute;
            top: 16px;
            left: 16px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            backdrop-filter: blur(4px);
            border: 1px solid #8b8b8b;
            z-index: 10;
            pointer-events: none;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        #touchHint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,240,0.8);
            background: rgba(0,0,0,0.4);
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 15px;
            backdrop-filter: blur(3px);
            border: 1px solid #a0a080;
            z-index: 10;
            pointer-events: none;
            white-space: nowrap;
            font-weight: 500;
        }
        /* Главное меню — стиль "земля" */
        #mainMenu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, #7ec850, #3d7a2a);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.4s ease;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
            padding: 20px;
        }
        #mainMenu.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #mainMenu h1 {
            font-size: clamp(40px, 12vw, 80px);
            color: #fff;
            text-shadow: 4px 4px 0 #3d5a2a, 0 0 30px #6a9e4b;
            letter-spacing: 3px;
            margin-bottom: 30px;
            background: rgba(0,0,0,0.2);
            padding: 8px 30px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            border: 2px solid #b8d9a0;
            text-align: center;
            line-height: 1.2;
        }
        .menu-btn {
            background: #c6a86b;
            border: 4px solid #5d3f1a;
            color: #2d1f0c;
            font-size: clamp(22px, 6vw, 34px);
            font-weight: bold;
            padding: 16px 30px;
            margin: 10px;
            width: min(300px, 80%);
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 8px 0 #5d3f1a, 0 10px 25px rgba(0,0,0,0.3);
            text-shadow: 0 2px 0 #e6d5a0;
            letter-spacing: 2px;
            font-family: inherit;
            text-transform: uppercase;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .menu-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #5d3f1a;
        }
        .menu-btn.secondary {
            background: #8faa7a;
            border-color: #3a552a;
            box-shadow: 0 8px 0 #3a552a;
            color: #1f2e12;
            text-shadow: 0 2px 0 #b8d09e;
        }
        .menu-btn.secondary:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #3a552a;
        }
        #settingsPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(25, 25, 30, 0.95);
            padding: 30px 25px;
            border-radius: 40px;
            border: 3px solid #b8a67a;
            backdrop-filter: blur(12px);
            color: #eee;
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 200;
            min-width: min(320px, 85%);
            box-shadow: 0 30px 80px rgba(0,0,0,0.9);
            max-width: 90%;
        }
        #settingsPanel h2 {
            margin-top: 0;
            color: #f0e6c5;
            border-bottom: 2px solid #6a8c5a;
            padding-bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: clamp(24px, 6vw, 34px);
        }
        #settingsPanel label {
            font-size: clamp(18px, 4.5vw, 24px);
            margin: 10px 0 6px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }
        #settingsPanel input[type="range"] {
            width: min(200px, 60%);
            height: 8px;
            accent-color: #8cb87a;
            touch-action: none;
        }
        .close-settings {
            background: #b35f5f;
            border: 3px solid #6b2e2e;
            color: white;
            font-size: clamp(20px, 5vw, 28px);
            padding: 12px 30px;
            margin-top: 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.1s;
            font-family: inherit;
            font-weight: bold;
            box-shadow: 0 4px 0 #4a1e1e;
            touch-action: manipulation;
            width: 100%;
            max-width: 250px;
        }
        .close-settings:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #4a1e1e;
        }
        #multiplayerStatus {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: #aaffaa;
            padding: 14px 24px;
            border-radius: 60px;
            font-size: clamp(18px, 5vw, 28px);
            border: 2px solid #6f9e6f;
            backdrop-filter: blur(6px);
            z-index: 50;
            display: none;
            text-align: center;
            font-weight: bold;
            text-shadow: 0 0 16px #2f7a2f;
            width: 80%;
            max-width: 400px;
            letter-spacing: 1px;
        }
        #statusMessage {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #ffd966;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: clamp(18px, 4.5vw, 26px);
            border: 2px solid #b89a4a;
            z-index: 40;
            backdrop-filter: blur(4px);
            display: none;
            font-weight: bold;
            white-space: nowrap;
            max-width: 90%;
            text-overflow: ellipsis;
            overflow: hidden;
        }
        @media (max-width: 700px) {
            .menu-btn { padding: 14px 20px; }
            #mainMenu h1 { margin-bottom: 20px; }
        }
        @media (orientation: portrait) and (max-width: 500px) {
            .menu-btn { width: 90%; }
        }
        /* Стиль для кнопок в мультиплеере (симуляция) */
        .fake-multi {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            background: rgba(30,30,30,0.8);
            color: #eee;
            padding: 10px 24px;
            border-radius: 40px;
            border: 2px solid #6a8c5a;
            font-size: 18px;
            backdrop-filter: blur(4px);
            display: none;
            pointer-events: none;
        }
        #canvasContainer {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
    </style>
</head>
<body>
    <div id="info">⛏️ Minecraft PE</div>
    <div id="touchHint">👆 Один палец — осмотр, два — движение</div>
    <div id="statusMessage"></div>
    <div id="multiplayerStatus">🔍 Поиск второго игрока...</div>
    <div class="fake-multi" id="multiFake">👥 Режим 2 игрока (симуляция)</div>

    <div id="mainMenu">
        <h1>⛏️ МИР</h1>
        <button class="menu-btn" id="singleBtn">🌍 Одиночный мир</button>
        <button class="menu-btn secondary" id="multiBtn">👥 Мультиплеер</button>
        <button class="menu-btn" id="settingsBtn">⚙️ Настройки</button>
        <div style="margin-top: 20px; font-size: clamp(12px, 3vw, 18px); color: #d4d4a0; text-shadow: 0 2px 4px black; text-align: center;">для iPad / сенсор</div>
    </div>

    <div id="settingsPanel">
        <h2>⚙️ Настройки</h2>
        <label>🎨 Яркость <input type="range" id="brightnessSlider" min="0.3" max="1.8" step="0.1" value="1.0"></label>
        <label>🔊 Громкость <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.5"></label>
        <label>🌿 Дальность <input type="range" id="distanceSlider" min="4" max="14" step="1" value="8"></label>
        <button class="close-settings" id="closeSettingsBtn">✕ Закрыть</button>
    </div>

    <div id="canvasContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js';

        // --- Инициализация сцены ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(12, 10, 18);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvasContainer').appendChild(renderer.domElement);

        // --- Освещение ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffeedd, 1);
        dirLight.position.set(20, 30, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        const d = 25;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 50;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0x99bbff, 0.4);
        fillLight.position.set(-20, 10, -20);
        scene.add(fillLight);

        // --- Управление (OrbitControls с сенсорной поддержкой) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 2, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.minDistance = 4;
        controls.maxDistance = 30;
        controls.enablePan = true;
        controls.panSpeed = 0.8;
        controls.rotateSpeed = 0.8;
        controls.zoomSpeed = 0.8;
        controls.update();

        // --- Генерация мира (классический кубический ландшафт) ---
        function generateWorld() {
            const blockSize = 1;
            const ground = new THREE.Group();

            // Земля (травяной слой + камень)
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x7cb342, roughness: 0.8, emissive: new THREE.Color(0x223300), emissiveIntensity: 0.05 });
            const dirtMat = new THREE.MeshStandardMaterial({ color: 0x8d6e3f, roughness: 0.9 });
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x8a8a8a, roughness: 0.7 });
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b6b4d, roughness: 0.8 });
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.7 });

            // Размер мира 12x12
            const size = 12;
            const half = size / 2;

            for (let x = -half; x < half; x++) {
                for (let z = -half; z < half; z++) {
                    // Высота с шумоподобным рельефом
                    const h = Math.floor(
                        1.5 + 1.2 * Math.sin(x * 0.7) * Math.cos(z * 0.5) +
                        0.8 * Math.sin(x * 0.3 + z * 0.6) +
                        0.5 * Math.cos(x * 1.2 + z * 0.9)
                    );
                    const height = Math.max(1, Math.min(4, h));

                    // Блоки снизу вверх
                    for (let y = 0; y < height; y++) {
                        let mat;
                        if (y === height - 1) mat = grassMat;
                        else if (y > height - 3) mat = dirtMat;
                        else mat = stoneMat;

                        const block = new THREE.Mesh(new THREE.BoxGeometry(blockSize * 0.98, blockSize * 0.98, blockSize * 0.98), mat);
                        block.position.set(x + 0.5, y + 0.5, z + 0.5);
                        block.castShadow = true;
                        block.receiveShadow = true;
                        ground.add(block);
                    }
                }
            }

            // Несколько деревьев
            function addTree(posX, posZ) {
                const trunkHeight = 3 + Math.floor(Math.random() * 2);
                for (let i = 0; i < trunkHeight; i++) {
                    const block = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), woodMat);
                    block.position.set(posX, i + 1.5, posZ);
                    block.castShadow = true;
                    block.receiveShadow = true;
                    ground.add(block);
                }
                // Крона
                const leafPositions = [
                    [0, trunkHeight + 1, 0], [1, trunkHeight, 0], [-1, trunkHeight, 0],
                    [0, trunkHeight, 1], [0, trunkHeight, -1], [1, trunkHeight + 1, 0],
                    [-1, trunkHeight + 1, 0], [0, trunkHeight + 1, 1], [0, trunkHeight + 1, -1],
                    [0, trunkHeight + 2, 0]
                ];
                leafPositions.forEach(pos => {
                    const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), leafMat);
                    leaf.position.set(posX + pos[0], pos[1] + 0.5, posZ + pos[2]);
                    leaf.castShadow = true;
                    leaf.receiveShadow = true;
                    ground.add(leaf);
                });
            }

            // Деревья в случайных местах
            const treePositions = [
                [-3, -3], [4, -2], [-4, 3], [2, 5], [-5, -5], [5, 4], [0, -5], [-2, 5]
            ];
            treePositions.forEach(pos => {
                // Проверим, что не слишком близко к краю
                if (Math.abs(pos[0]) < 5.5 && Math.abs(pos[1]) < 5.5) {
                    addTree(pos[0] + 0.5, pos[1] + 0.5);
                }
            });

            // Несколько цветов (маленькие кубики)
            const flowerMat = new THREE.MeshStandardMaterial({ color: 0xff4d4d });
            const flowerMat2 = new THREE.MeshStandardMaterial({ color: 0xffaa33 });
            for (let i = 0; i < 20; i++) {
                const x = (Math.random() - 0.5) * 18;
                const z = (Math.random() - 0.5) * 18;
                if (Math.abs(x) < 5.5 && Math.abs(z) < 5.5) {
                    const flower = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), Math.random() > 0.5 ? flowerMat : flowerMat2);
                    flower.position.set(x + 0.5, 1.1, z + 0.5);
                    flower.castShadow = true;
                    ground.add(flower);
                }
            }

            scene.add(ground);
            return ground;
        }

        // Генерируем мир
        const worldGroup = generateWorld();

        // --- Функции меню ---
        const mainMenu = document.getElementById('mainMenu');
        const settingsPanel = document.getElementById('settingsPanel');
        const statusMsg = document.getElementById('statusMessage');
        const multiStatus = document.getElementById('multiplayerStatus');
        const multiFake = document.getElementById('multiFake');

        let currentMode = 'single'; // 'single' или 'multi'

        function hideAllUI() {
            mainMenu.classList.add('hidden');
            settingsPanel.style.display = 'none';
            statusMsg.style.display = 'none';
            multiStatus.style.display = 'none';
            multiFake.style.display = 'none';
        }

        function showStatus(text, isMulti = false) {
            if (isMulti) {
                multiStatus.style.display = 'block';
                multiStatus.textContent = text;
            } else {
                statusMsg.style.display = 'block';
                statusMsg.textContent = text;
                setTimeout(() => { statusMsg.style.display = 'none'; }, 2500);
            }
        }

        // Одиночный мир
        document.getElementById('singleBtn').addEventListener('click', () => {
            hideAllUI();
            currentMode = 'single';
            showStatus('🌍 Одиночный мир загружен', false);
            multiFake.style.display = 'none';
            // Сброс камеры
            camera.position.set(12, 10, 18);
            controls.target.set(0, 2, 0);
            controls.update();
        });

        // Мультиплеер (поиск второго игрока)
        document.getElementById('multiBtn').addEventListener('click', () => {
            hideAllUI();
            currentMode = 'multi';
            multiFake.style.display = 'block';
            multiFake.textContent = '👥 Режим 2 игрока (симуляция)';
            showStatus('🔍 Поиск второго игрока...', true);
            // Симуляция поиска
            setTimeout(() => {
                multiStatus.textContent = '✅ Игрок найден! 2 игрока в мире';
                multiStatus.style.color = '#aaffaa';
                setTimeout(() => {
                    multiStatus.textContent = '🎮 Игра началась! (симуляция)';
                }, 1200);
            }, 1800);
            camera.position.set(10, 8, 14);
            controls.target.set(0, 2, 0);
            controls.update();
        });

        // Настройки
        document.getElementById('settingsBtn').addEventListener('click', () => {
            settingsPanel.style.display = 'flex';
        });
        document.getElementById('closeSettingsBtn').addEventListener('click', () => {
            settingsPanel.style.display = 'none';
        });

        // Настройки: яркость
        document.getElementById('brightnessSlider').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            ambientLight.intensity = 0.3 * val;
            dirLight.intensity = 0.8 * val;
        });

        // Настройки: дальность (просто информативно)
        document.getElementById('distanceSlider').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            // Изменяем дальность камеры (maxDistance)
            controls.maxDistance = 20 + val * 2;
        });

        // --- Адаптация под размер экрана ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // --- Анимация ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- Небольшая подсказка для сенсора ---
        console.log('Minecraft для iPad: используйте один палец для осмотра, два для перемещения.');
    </script>
</body>
</html>
